# Configuration du plugin Cloud Sync Engine « Recherche Documentaire »
sync:
  # Lettre de drive montée (CfApi) donnant accès au répertoire « Documents » du NAS.
  # L'outil ne gère pas lui-même la connexion au NAS (QuickConnect/identifiants) :
  # il s'appuie sur le drive déjà monté. Utilisez `check-connection` pour diagnostiquer.
  drive_letter: "R:"
  # Répertoire (caché) de la base de données ; optionnel (défaut: APPDATA/RechercheDocumentaire)
  db_dir: null
  # Racine locale (simulation / tests hors Cloud Sync Engine)
  local_root: "./drive_root"

# Configuration de l'Agent IA de sauvegarde de factures par courriel
mail:
  imap_url: "imap.example.com"
  login: "prenom.nom@example.com"
  password: "motdepasse_messagerie"
  # Répertoire « Documents » dans lequel sauvegarder les PDF produits
  documents_dir: "./drive_root/Documents"
  # Date de dernier run (AAAA-MM-JJ) ; absent => 30 jours
  last_run: null
